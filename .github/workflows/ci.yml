name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.13
      - run: uv sync --locked --all-extras --dev

      # Ground truth is generated by the extractor under test, so its F1 test is
      # a tautology. These checks run on a different mechanism and are the real
      # gate -- they must pass before any number below means anything.
      - name: Verify ground truth
        run: uv run python -m eval.verify_truth

      - name: Tests
        run: uv run pytest -q

      # The eval feeds set iteration order into a seeded RNG; a stray unsorted
      # set silently un-reproduces every published number. The test suite covers
      # this via subprocesses, and running the whole eval under three fixed hash
      # seeds catches anything the tests do not reach.
      - name: Reproducible under hash randomisation
        run: |
          for hs in 0 1 12345; do
            PYTHONHASHSEED=$hs uv run python -m eval.harness       --seed 0 --out "$RUNNER_TEMP/hs$hs" >/dev/null
            PYTHONHASHSEED=$hs uv run python -m eval.heal_eval     --seed 0 --out "$RUNNER_TEMP/hs$hs" >/dev/null
            PYTHONHASHSEED=$hs uv run python -m eval.perceive_eval --seed 0 --out "$RUNNER_TEMP/hs$hs" >/dev/null
            PYTHONHASHSEED=$hs uv run python -m eval.ablations     --seed 0 --out "$RUNNER_TEMP/hs$hs" >/dev/null
          done
          for hs in 1 12345; do
            for f in b0_static heal perceive ablations; do
              diff -q "$RUNNER_TEMP/hs0/seed0/$f.json" "$RUNNER_TEMP/hs$hs/seed0/$f.json" \
                || { echo "$f output varies with PYTHONHASHSEED=$hs"; exit 1; }
            done
          done
          echo "identical across hash seeds"

      - name: Baseline has not drifted
        run: uv run python -m eval.check_baseline

      # Exits non-zero on ANY false alarm on a clean or content-churned page, and
      # on any genuinely degraded case the monitor failed to fire on. A detector
      # that cries wolf is worthless, so it is a build failure, not a metric.
      - name: Breakage detection and false-alarm rate
        run: uv run python -m eval.perceive_eval --seed 0

      - name: Healing results have not drifted
        run: uv run python -m eval.check_heal

      - name: Baseline summary
        run: uv run python -m eval.harness --seed 0 | tail -8

      - name: Healing summary
        run: uv run python -m eval.heal_eval --seed 0 | tail -14

      - name: Ablations
        run: uv run python -m eval.ablations --seed 0
