<!doctype html>
<meta charset="utf-8">
<title>Autoheal — self-healing extraction</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--line:#272e38;--fg:#e6edf3;--dim:#8b949e;
        --ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff;--vio:#bc8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  h1{font-size:14px;margin:0;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  button{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:6px;
         padding:5px 11px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--acc)} button:disabled{opacity:.4;cursor:default}
  #bar{height:3px;background:var(--line)} #fill{height:100%;width:0;background:var(--acc);transition:width .2s}
  main{display:grid;grid-template-columns:minmax(320px,38%) 1fr;gap:12px;padding:12px;
       align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
  .panel>h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
            margin:0;padding:8px 12px;border-bottom:1px solid var(--line)}
  .body{padding:10px 12px}
  iframe{width:100%;height:290px;border:0;border-radius:0 0 8px 8px;background:#fff}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
  .kv b{font-weight:600}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid}
  .b-bad{color:var(--bad);border-color:var(--bad)} .b-ok{color:var(--ok);border-color:var(--ok)}
  .b-warn{color:var(--warn);border-color:var(--warn)}
  .row{padding:6px 0;border-top:1px solid var(--line)} .row:first-child{border-top:0}
  .tag{color:var(--vio)} .dim{color:var(--dim)} .ok{color:var(--ok)} .bad{color:var(--bad)}
  .acc{color:var(--acc)}
  code{color:var(--acc);word-break:break-all}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:3px 6px;border-top:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  tr.win td{background:rgba(63,185,80,.10)}
  .gate{display:inline-block;margin-right:8px;padding:3px 10px;border-radius:6px;
        border:1px solid var(--line);color:var(--dim)}
  .gate.pass{color:var(--ok);border-color:var(--ok)}
  .gate.fail{color:var(--bad);border-color:var(--bad)}
  pre{margin:0;white-space:pre-wrap;font-size:12px}
  .ins{color:var(--ok)} .mov{color:var(--warn)} .del{color:var(--bad)}
  .ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ab>div{border:1px solid var(--line);border-radius:6px;padding:10px}
  .big{font-size:22px;font-weight:600}
  .empty{color:var(--dim);font-style:italic}
</style>

<header>
  <h1>autoheal</h1>
  <div><span id="title">—</span> <span class="sub" id="subtitle"></span></div>
  <div class="spacer"></div>
  <button id="back">‹ step</button>
  <button id="play">▶ play</button>
  <button id="fwd">step ›</button>
  <button id="reset">restart</button>
  <span class="sub" id="pos"></span>
</header>
<div id="bar"><div id="fill"></div></div>

<main>
  <div>
    <div class="panel"><h2>the page <span id="pagesite" class="dim"></span></h2>
      <div class="body sub" id="mutation">—</div>
      <iframe id="page" sandbox></iframe></div>
    <div class="panel"><h2>static extractor (B0) — no healing</h2>
      <div class="body" id="static"><span class="empty">waiting…</span></div></div>
  </div>
  <div>
    <div class="panel"><h2>perceive — health signals</h2>
      <div class="body" id="health"><span class="empty">quiet</span></div></div>
    <div class="panel"><h2>diagnose — structural diff &amp; ranked candidates</h2>
      <div class="body" id="trace"><span class="empty">—</span></div></div>
    <div class="panel"><h2>verify — three gates, all mandatory</h2>
      <div class="body" id="gates"><span class="empty">—</span></div></div>
    <div class="panel"><h2>patch — spec lineage</h2>
      <div class="body"><pre id="specdiff" class="empty">—</pre></div></div>
    <div class="panel" id="abpanel" style="display:none"><h2>remember — same break, with and without memory</h2>
      <div class="body ab" id="ab"></div></div>
  </div>
</main>

<script id="events" type="application/json">/*__EVENTS__*/</script>
<script>
const DATA = JSON.parse(document.getElementById('events').textContent);
const EV = DATA.events;
const $ = id => document.getElementById(id);
let i = 0, timer = null, playing = false;

const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num = (v, d=2) => (v === null || v === undefined) ? '—' : Number(v).toFixed(d);

function resetAll(){
  $('static').innerHTML = '<span class="empty">waiting…</span>';
  $('health').innerHTML = '<span class="empty">quiet</span>';
  $('trace').innerHTML = '<span class="empty">—</span>';
  $('gates').innerHTML = '<span class="empty">—</span>';
  $('specdiff').textContent = '—'; $('specdiff').className = 'empty';
  $('abpanel').style.display = 'none'; $('ab').innerHTML = '';
  $('page').srcdoc = ''; $('mutation').textContent = '—'; $('pagesite').textContent = '';
  $('title').textContent = '—'; $('subtitle').textContent = '';
}
const append = (el, html) => {
  if (el.querySelector('.empty')) el.innerHTML = '';
  el.insertAdjacentHTML('beforeend', html);
};

function apply(e){
  if (e.kind === 'act'){
    // Title only. Clearing the panels here wiped Act I's health evidence at the
    // exact moment Act II started explaining it -- the panels belong to a page,
    // not to an act, so they are cleared on 'page' instead.
    $('title').textContent = 'Act ' + e.act + ' — ' + e.title;
    $('subtitle').textContent = e.subtitle;
  }
  if (e.kind === 'page'){
    $('health').innerHTML = '<span class="empty">quiet</span>';
    $('trace').innerHTML = '<span class="empty">—</span>';
    $('gates').innerHTML = '<span class="empty">—</span>';
    $('specdiff').textContent = '—'; $('specdiff').className = 'empty';
    $('page').srcdoc = e.broken_html;
    $('pagesite').textContent = e.site;
    $('mutation').innerHTML = esc(e.mutation) + ' — marker <code>.' + esc(e.marker) + '</code>';
  }
  if (e.kind === 'static'){
    const rows = (e.sample || []).map(s =>
      `<div class="row"><span class="tag">${esc(s.field)}</span>
       got <span class="bad">${esc(JSON.stringify(s.got))}</span>
       expected <span class="ok">${esc(JSON.stringify(s.expected))}</span></div>`).join('');
    $('static').innerHTML =
      `<div class="kv"><span>records written</span><b>${e.records}</b></div>
       <div class="kv"><span>fill rate</span><b class="ok">${(e.fill*100).toFixed(0)}%</b></div>
       <div class="kv"><span>F1 vs frozen truth</span><b class="bad">${num(e.f1)}</b></div>
       <div class="kv"><span>errors raised</span><b>0</b></div>
       ${e.silent ? '<p><span class="badge b-bad">SILENT FAILURE — high fill, wrong values</span></p>' : ''}
       ${rows}`;
  }
  if (e.kind === 'health'){
    const chips = Object.entries(e.scores || {}).map(([f,v]) =>
      `<span class="badge ${v>=0.6?'b-bad':'b-warn'}">${esc(f)} ${num(v)}</span>`).join(' ');
    $('health').innerHTML = `<div>${chips || '<span class="empty">quiet</span>'}</div>`;
  }
  if (e.kind === 'signal'){
    append($('health'),
      `<div class="row"><span class="tag">${esc(e.field)}</span>
       <span class="acc">${esc(e.name)}</span> <span class="dim">${num(e.magnitude)}</span><br>
       <span class="dim">${esc(e.evidence)}</span></div>`);
  }
  if (e.kind === 'diff'){
    append($('trace'), `<div class="row"><b>DOM diff</b> → <span class="acc">${esc(e.summary)}</span><br>
      ${(e.evidence||[]).map(x=>`<span class="dim">${esc(x)}</span>`).join('<br>')}</div>`);
  }
  if (e.kind === 'candidates'){
    const rows = e.items.map((c,n) => `<tr class="${n===0?'win':''}">
      <td>${n}</td><td>${esc(c.kind)}</td><td><code>${esc(c.q)}</code>${c.attr?' <span class="dim">@'+esc(c.attr)+'</span>':''}</td>
      <td>${num(c.recovery)}</td><td>${num(c.prior)}</td><td>${c.survives_old?'<span class="ok">yes</span>':'<span class="dim">no</span>'}</td></tr>`).join('');
    append($('trace'), `<div class="row"><b class="tag">${esc(e.field)}</b>
      <span class="dim">${e.items.length} candidates ranked — ${esc(e.cost)}</span>
      ${(e.recalled||[]).map(r=>`<div class="dim">↺ ${esc(r)}</div>`).join('')}
      <table><tr><th>#</th><th>kind</th><th>query</th><th>recovers</th><th>prior</th><th>old page</th></tr>${rows}</table></div>`);
  }
  if (e.kind === 'patch'){
    append($('trace'), `<div class="row"><span class="ok">patch</span> ${esc(e.describe)}</div>`);
  }
  if (e.kind === 'gate'){
    append($('gates'), `<span class="gate ${e.passed?'pass':'fail'}">${e.passed?'✓':'✗'} ${esc(e.name)}</span>`);
  }
  if (e.kind === 'specdiff'){
    $('specdiff').className = '';
    $('specdiff').innerHTML = (e.lines||[]).map(l => {
      const t = esc(l);
      if (l.trim().startsWith('+')) return '<span class="ins">'+t+'</span>';
      if (l.trim().startsWith('~')) return '<span class="mov">'+t+'</span>';
      if (l.trim().startsWith('-')) return '<span class="del">'+t+'</span>';
      return t;
    }).join('\n');
  }
  if (e.kind === 'note'){ append($('trace'), `<div class="row dim">${esc(e.text)}</div>`); }
  if (e.kind === 'result'){
    append($('gates'), `<div class="row">${e.healed?'<span class="badge b-ok">HEALED</span>':'<span class="badge b-bad">QUARANTINED</span>'}
      <span class="dim">${esc(e.version)} · ${e.cycles} cycle · F1 ${num(e.f1_before)} → ${num(e.f1_after)}
      · ${e.llm_calls} model call(s) · ${e.tokens} tokens</span></div>`);
  }
  if (e.kind === 'ab'){
    $('abpanel').style.display = '';
    const card = (t, d, cls) => `<div><div class="dim">${t}</div>
      <div class="big ${cls}">${d.tokens} <span class="sub">tokens</span></div>
      <div class="dim">${d.calls} model call(s)${d.avoided?', '+d.avoided+' avoided by recall':''}</div>
      <div class="dim">F1 ${num(d.f1)} · ${d.healed?'healed':'not healed'}</div></div>`;
    $('ab').innerHTML = card('with the episode quotes left behind', e.with_memory, 'ok')
                      + card('memory ablated', e.ablated, 'bad');
  }
}

function render(){
  resetAll();
  for (let k = 0; k <= i && k < EV.length; k++) apply(EV[k]);
  $('pos').textContent = `${Math.min(i+1,EV.length)}/${EV.length}`;
  $('fill').style.width = ((i+1)/EV.length*100) + '%';
  $('back').disabled = i <= 0; $('fwd').disabled = i >= EV.length-1;
}
function step(n){ i = Math.max(0, Math.min(EV.length-1, i+n)); render(); }
function tick(){
  if (!playing) return;
  if (i >= EV.length-1){ stop(); return; }
  i++; render();
  timer = setTimeout(tick, EV[i].hold || 800);
}
function play(){ playing = true; $('play').textContent = '❚❚ pause'; tick(); }
function stop(){ playing = false; $('play').textContent = '▶ play'; clearTimeout(timer); }

$('play').onclick = () => playing ? stop() : play();
$('fwd').onclick = () => { stop(); step(1); };
$('back').onclick = () => { stop(); step(-1); };
$('reset').onclick = () => { stop(); i = 0; render(); };
// Keys are bound on `window`, and focus is pulled back out of the page pane
// after any click. The left pane is a sandboxed <iframe>; clicking inside it
// moves focus there and it swallows every keystroke, so Space and the arrows
// silently stopped working as soon as anyone touched the thing they were
// looking at.
window.addEventListener('keydown', ev => {
  if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if (ev.key === ' '){ ev.preventDefault(); playing ? stop() : play(); }
  if (ev.key === 'ArrowRight'){ ev.preventDefault(); stop(); step(1); }
  if (ev.key === 'ArrowLeft'){ ev.preventDefault(); stop(); step(-1); }
  if (ev.key === 'r' || ev.key === 'R'){ stop(); i = 0; render(); }
});
// The iframe can still take focus on click; take it straight back.
window.addEventListener('blur', () => setTimeout(() => window.focus(), 0));
document.addEventListener('click', () => window.focus());
window.focus();

render();
</script>
