[project]
name = "autoheal"
version = "0.1.0"
description = "Self-healing web extraction: perceive, diagnose, patch, verify, remember"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cssselect>=1.5.0",
    "lxml>=6.1.2",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoheal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
